{% set rows = recent if recent is defined else pagination.items %}
<div class="table-wrap">
<table class="table">
  <thead><tr><th>URL</th><th>Résultat</th><th>Date</th><th>Action</th></tr></thead>
  <tbody>
    {% for a in rows %}
    <tr>
      <td class="url-cell" title="{{ a.url }}">{{ a.url }}</td>
      <td>
        {% if a.label == 'Phishing' %}<span class="badge bad">Phishing</span>
        {% else %}<span class="badge ok">Sûre</span>{% endif %}
      </td>
      <td>{{ a.created_at|localdt }}</td>
      <td><a class="link" href="{{ url_for('main.analysis_detail', analysis_id=a.id) }}">Voir</a></td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="empty">Aucune analyse pour le moment.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
